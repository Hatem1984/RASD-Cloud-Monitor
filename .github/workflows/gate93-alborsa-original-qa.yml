name: RASD — alborsa genuine original publisher screenshot QA (no email)
on:
  push:
    branches:
      - 'gate93-*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-alborsa-no-send:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing original page image dependencies
        run: |
          python -m pip install -r requirements-test.txt 'playwright>=1.50,<2'
          python -m playwright install --only-shell chromium
      - name: Historical original Alborsa page screenshot — no secret or email
        env:
          RASD_GMAIL_SENDER: ''
          RASD_GMAIL_APP_PASSWORD: ''
          RASD_REPORT_TO: ''
          RASD_PRIVATE_LEDGER_TOKEN: ''
        run: python rasd_alborsa_original_qa.py
