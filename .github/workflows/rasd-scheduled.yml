name: RASD — 30-minute newsroom monitoring + Cairo daily rollup

on:
  workflow_dispatch:  # Safe GitHub-hosted preview only: no credentials, no email
  schedule:
    - cron: '0,30 * * * *'
    # 22:00 Africa/Cairo is 19:00 UTC in summer or 20:00 UTC in winter.
    # 22:00 interval trigger is skipped by runner to avoid competing mail.
    - cron: '0 19,20 * * *'

permissions:
  contents: read

# Never cancel an already-reserved email or race two private ledger writes.
concurrency:
  group: rasd-scheduled-monitor-private-ledger
  cancel-in-progress: false

jobs:
  no-send-preview:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline tests only
        run: python -m pip install -r requirements-test.txt
      - name: Verify schedule, duplicates, and trust boundaries offline
        run: python -m unittest discover -s tests -p test_scheduled_rasd.py -v
      - name: Show safe clock preflight (no credentials or email)
        run: python scheduled_rasd.py --mode dry_run

  protected-scheduled-monitor:
    # Mandatory human-operated opt-in. Vars unset => the cron is INERT.
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main' && vars.RASD_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    environment: rasd-production
    env:
      RASD_AUTOMATION_ENABLED: ${{ vars.RASD_AUTOMATION_ENABLED }}
      RASD_JOB_CRON: ${{ github.event.schedule }}
      RASD_GMAIL_SENDER: ${{ secrets.RASD_GMAIL_SENDER }}
      RASD_REPORT_TO: ${{ secrets.RASD_REPORT_TO }}
      RASD_GMAIL_APP_PASSWORD: ${{ secrets.RASD_GMAIL_APP_PASSWORD }}
      RASD_PRIVATE_LEDGER_TOKEN: ${{ secrets.RASD_PRIVATE_LEDGER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reviewed original publisher image dependencies
        run: |
          python -m pip install -r requirements-test.txt 'playwright>=1.50,<2'
          python -m playwright install --only-shell chromium
      - name: Validate scheduler security boundary offline before any private I/O
        run: python -m unittest discover -s tests -p test_scheduled_rasd.py -v
      - name: Research and email verified Word from GitHub cloud worker
        shell: bash
        run: |
          set -euo pipefail
          case "$RASD_JOB_CRON" in
            '0,30 * * * *') mode=interval ;;
            '0 19,20 * * *') mode=rollup ;;
            *) echo 'RASD_UNEXPECTED_SCHEDULE_HOLD'; exit 1 ;;
          esac
          python scheduled_rasd.py --mode "$mode"