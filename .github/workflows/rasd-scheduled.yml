name: RASD — 30-minute newsroom monitoring + Cairo daily rollup

on:
  push:
    branches:
      - main # protected send still requires exact owner push commit signal
  workflow_dispatch:  # Safe GitHub-hosted preview only: no credentials, no email
  schedule:
    # Off-peak redundant slots: two independent opportunities per 30m window.
    # GitHub scheduling is best effort; private CAS prevents duplicate email.
    - cron: '7,18,37,48 * * * *'
    # 22:00 Africa/Cairo is 19:00 UTC in summer or 20:00 UTC in winter.
    # 22:00 interval trigger is skipped by runner to avoid competing mail.
    - cron: '0 19,20 * * *'

permissions:
  contents: read

# Never cancel an already-reserved email or race two private ledger writes.
concurrency:
  group: rasd-scheduled-monitor-private-ledger
  cancel-in-progress: false

jobs:
  protected-whole-daily-readonly-probe:
    # Exact owner main push only. Proves all accepted originals in one Word.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Hatem1984' &&
      github.event.head_commit.message == 'RASD-OWNER-WHOLE-DAILY-NO-SEND-2026-10-24'
    runs-on: ubuntu-latest
    timeout-minutes: 13
    environment: rasd-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline Word evidence dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Assemble previously accepted originals with no outbound email
        env:
          RASD_GMAIL_SENDER: ${{ secrets.RASD_GMAIL_SENDER }}
          RASD_REPORT_TO: ${{ secrets.RASD_REPORT_TO }}
          RASD_GMAIL_APP_PASSWORD: ${{ secrets.RASD_GMAIL_APP_PASSWORD }}
          RASD_PRIVATE_LEDGER_TOKEN: ${{ secrets.RASD_PRIVATE_LEDGER_TOKEN }}
        run: python probe_daily_consolidation_read_only.py
  protected-sent-archive-readonly-probe:
    # Owner-only, exact signed main-commit signal; NO SMTP sending.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Hatem1984' &&
      github.event.head_commit.message == 'RASD-OWNER-READONLY-IMAP-PROBE-2026-10-24'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: rasd-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline-only Word parsing dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Authenticate to sender Gmail Sent folder in read-only mode
        env:
          RASD_GMAIL_SENDER: ${{ secrets.RASD_GMAIL_SENDER }}
          RASD_REPORT_TO: ${{ secrets.RASD_REPORT_TO }}
          RASD_GMAIL_APP_PASSWORD: ${{ secrets.RASD_GMAIL_APP_PASSWORD }}
          RASD_PRIVATE_LEDGER_TOKEN: ${{ secrets.RASD_PRIVATE_LEDGER_TOKEN }}
        run: python probe_sent_archive_read_only.py
  no-send-preview:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline tests only
        run: python -m pip install -r requirements-test.txt
      - name: Verify schedule, duplicates, and trust boundaries offline
        run: python -m unittest discover -s tests -p test_scheduled_rasd.py -v
      - name: Show safe clock preflight (no credentials or email)
        run: python scheduled_rasd.py --mode dry_run

  protected-scheduled-monitor:
    # Authorized newsroom deployment: scheduled runs only on main, never
    # workflow_dispatch or PR. Owner can suspend instantly using repository
    # Actions variable RASD_AUTOMATION_PAUSED=true (default not paused).
    # Publisher refusals and evidence failures STILL abort before private CAS.
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.RASD_AUTOMATION_PAUSED != 'true' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'push' && github.actor == 'Hatem1984' &&
        (github.event.head_commit.message == 'RASD-OWNER-DAILY-2026-10-23' ||
         github.event.head_commit.message == 'RASD-OWNER-NEWSROOM-2026-10-24'))) 
    runs-on: ubuntu-latest
    timeout-minutes: 24
    environment: rasd-production
    env:
      RASD_AUTOMATION_ENABLED: 'true' # Owner-authorized production activation in signed main release
      RASD_DAILY_SENT_ARCHIVE_ENABLED: 'true' # PROVEN Gmail Sent IMAP read-only, run 40093969919
      RASD_JOB_CRON: ${{ github.event.schedule }}
      RASD_OWNER_PUSH_CONFIRM: ${{ github.event.head_commit.message }}
      RASD_GMAIL_SENDER: ${{ secrets.RASD_GMAIL_SENDER }}
      RASD_REPORT_TO: ${{ secrets.RASD_REPORT_TO }}
      RASD_REPORT_CC: ${{ vars.RASD_REPORT_CC }} # second destination, pinned by SHA256 in sender
      RASD_GMAIL_APP_PASSWORD: ${{ secrets.RASD_GMAIL_APP_PASSWORD }}
      RASD_PRIVATE_LEDGER_TOKEN: ${{ secrets.RASD_PRIVATE_LEDGER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reviewed original publisher image dependencies
        run: |
          python -m pip install -r requirements-test.txt 'playwright>=1.50,<2'
          python -m playwright install --only-shell chromium
      - name: Validate scheduler security boundary offline before any private I/O
        run: python -m unittest discover -s tests -p test_scheduled_rasd.py -v
      - name: Research and email verified Word from GitHub cloud worker
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            case "$RASD_OWNER_PUSH_CONFIRM" in
              'RASD-OWNER-DAILY-2026-10-23') mode=rollup_owner_once ;;
              'RASD-OWNER-NEWSROOM-2026-10-24') mode=interval_owner_once ;;
              *) echo 'RASD_OWNER_PUSH_NOT_AUTHORIZED'; exit 1 ;;
            esac
          else
            case "$RASD_JOB_CRON" in
              '7,18,37,48 * * * *') mode=interval ;;
              '0 19,20 * * *') mode=rollup ;;
              *) echo 'RASD_UNEXPECTED_SCHEDULE_HOLD'; exit 1 ;;
            esac
          fi
          # Reconcile the most recent completed 22:00 Cairo window even if
          # an unrelated interval-source verification failed. Both operations
          # independently authenticate schedule + private CAS; neither
          # retries an uncertain SMTP attempt. Preserve a failed interval's
          # nonzero workflow exit after the recovery opportunity.
          if [ "$mode" = interval ]; then
            interval_exit=0
            python scheduled_rasd.py --mode interval || interval_exit=$?
            recovery_exit=0
            python scheduled_rasd.py --mode rollup_recovery || recovery_exit=$?
            if [ "$interval_exit" -ne 0 ] || [ "$recovery_exit" -ne 0 ]; then
              echo 'RASD_SCHEDULED_INTERVAL_OR_DAILY_RECOVERY_HOLD'
              exit 1
            fi
          else
            python scheduled_rasd.py --mode "$mode"
          fi