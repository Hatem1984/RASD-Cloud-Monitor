name: RASD QA source connectivity — PUBLIC READ ONLY NO SEND

on:
  push:
    branches:
      - 'qa/owner-halfhour-cloud-review-20261103'
    paths:
      - '.github/workflows/rasd-stage1-public-source-qa-no-send.yml'
      - 'qa_stage1_cloud_feeds_no_send.py'
      - 'qa_stage1_cloud_all_sources_no_send.py'
      - 'sources_owner_daily_qa.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publisher-health-qa:
    if: github.repository == 'Hatem1984/RASD-Cloud-Monitor' && github.ref == 'refs/heads/qa/owner-halfhour-cloud-review-20261103'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      RASD_AUTOMATION_ENABLED: 'false'
      RASD_OWNER_SETTINGS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: First-party HTTP/RSS diagnostics (never follow redirects, never send)
        shell: bash
        run: |
          set -euo pipefail
          python qa_stage1_cloud_feeds_no_send.py
          python qa_stage1_cloud_all_sources_no_send.py
          echo 'RASD_QA_SMTP_SENT=false'
