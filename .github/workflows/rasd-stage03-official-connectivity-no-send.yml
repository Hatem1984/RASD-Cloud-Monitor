name: RASD Stage03 official transport and proof (NO SEND)
on:
  push:
    branches: ['gate-rasd-stage03-official-connectivity-20261126']
permissions:
  contents: read
jobs:
  bounded-official:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -r requirements-test.txt "playwright>=1.50,<2"
          python -m playwright install --only-shell chromium
      - name: Diagnose approved original origin and prove Word if available
        run: |
          python - <<'PY'
          import json, socket, ssl, subprocess, tempfile, hashlib, zipfile
          from datetime import date
          from pathlib import Path
          from urllib.parse import urlsplit
          from xml.etree import ElementTree as ET
          from official_ministry_source import NEWSLIST, discover_official_newslist, allowed_official_resource, original_publication_date, _read_original
          from rasd_official_daily import APPROVED_WORDS
          from cloud_proof_report import word_images_match_capture_digests
          from daily_report import render_docx
          from playwright.sync_api import sync_playwright
          assert subprocess.check_output(["git","diff","--name-only","a42717579ca1e10fec0eacabcd8b83667f784ba8","HEAD"],text=True).splitlines()==[".github/workflows/rasd-stage03-official-connectivity-no-send.yml"]
          host=urlsplit(NEWSLIST).hostname
          transport={"dns":False,"tcp":False,"tls":False}
          try:
              addresses=socket.getaddrinfo(host,443,type=socket.SOCK_STREAM)
              transport["dns"]=True
              transport["address_count"]=len({x[4][0] for x in addresses})
              with socket.create_connection((host,443),timeout=8) as conn:
                  transport["tcp"]=True
                  with ssl.create_default_context().wrap_socket(conn,server_hostname=host) as secure:
                      transport["tls"]=True
                      transport["tls_version"]=secure.version()
          except Exception as e:
              transport["error_type"]=type(e).__name__
              transport["errno"]=getattr(e,"errno",None)
          print(json.dumps({"mode":"official_transport","host":host,**transport}),flush=True)
          if not transport["tls"]:
              raise SystemExit("official_transport_hold")
          with tempfile.TemporaryDirectory(prefix="rasd-official-qa-") as td:
              out=Path(td)
              with sync_playwright() as p:
                  b=p.chromium.launch(headless=True)
                  try:
                      ctx=b.new_context(viewport={"width":1200,"height":900},locale="ar-EG",ignore_https_errors=False,accept_downloads=False,service_workers="block")
                      ctx.route("**/*",lambda r:r.continue_() if allowed_official_resource(r.request.url) else r.abort())
                      try:
                          urls=discover_official_newslist(ctx.request,max_articles=35)
                      except Exception as e:
                          print(json.dumps({"mode":"official_newslist","status":"HOLD","error_type":type(e).__name__,"connection_reset":"ECONNRESET" in str(e)}),flush=True)
                          raise SystemExit("official_newslist_hold")
                      print(json.dumps({"mode":"official_newslist","links":len(urls)}),flush=True)
                      page=ctx.new_page()
                      url=urls[0]
                      response=page.goto(url,wait_until="domcontentloaded",timeout=24000)
                      headline=" ".join(page.locator("h1").first.inner_text(timeout=8000).split())
                      published=original_publication_date(page.locator("body").inner_text(timeout=8000),headline)
                      if not published:raise SystemExit("official_date_hold")
                      row=_read_original(page,url,APPROVED_WORDS,published,out/"official.jpg")
                      print(json.dumps({"mode":"official_original","status":row["status"],"reason":row.get("reason"),"url":url,"date":row.get("published_date_cairo")}),flush=True)
                      if row["status"]!="verified":raise SystemExit("official_image_hold")
                      assert row["headline"]==headline and row["url"]==url
                  finally:b.close()
              word=out/"official.docx"
              article={"headline":row["headline"],"source":"Official Ministry original","url":row["url"],"published_at_cairo":row["published_date_cairo"],"published_display_cairo":row["published_date_cairo"],"evidence_image_path":row["image_path"]}
              render_docx({"title":"RASD QA only","display_window_start":"QA sample","display_window_end":"QA sample","coverage":"OFFICIAL_SOURCE_ONLY","verified_links":1,"articles":[article],"sources":[],"limitations":"Original official date only; QA no delivery"},word)
              with zipfile.ZipFile(word) as z:
                  root=ET.fromstring(z.read("word/document.xml"))
                  text=" ".join(x.text or "" for x in root.iter("{http://schemas.openxmlformats.org/wordprocessingml/2006/main}t"))
                  rel=ET.fromstring(z.read("word/_rels/document.xml.rels"))
                  title_match=row["headline"] in text
                  date_match=row["published_date_cairo"] in text
                  link_match=any(x.get("Target")==url for x in rel)
                  zip_ok=z.testzip() is None
              digest_match=word_images_match_capture_digests(word,[row])
              print(json.dumps({"mode":"official_word_proof","production_sha":"a42717579ca1e10fec0eacabcd8b83667f784ba8","title_match":title_match,"date_match":date_match,"link_match":link_match,"jpeg_digest_match":digest_match,"zip_ok":zip_ok,"email_sent":False,"private_state_used":False,"artifact_uploaded":False}),flush=True)
              assert title_match and date_match and link_match and digest_match and zip_ok
          PY
