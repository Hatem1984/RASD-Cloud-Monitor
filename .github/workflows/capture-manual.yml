name: RASD publisher capture — manual only, no email

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rasd-public-browser-acceptance
  cancel-in-progress: false

jobs:
  verify-public-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Read independent public worker
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public browser dependencies
        run: |
          python -m pip install -r requirements-test.txt "playwright>=1.50,<2"
          python -m playwright install --with-deps chromium
      - name: Test source guardrails and blank-image rejection offline
        run: python -m unittest discover -s tests -v
      - name: Inspect public RSS and capture one actual publisher webpage
        run: python screenshot_probe.py
      - name: Retain browser screenshot only in ephemeral runner (never public artifact)
        if: always()
        shell: bash
        run: |
          echo "Publisher screenshots stay private to this job; no public JPEG upload."
