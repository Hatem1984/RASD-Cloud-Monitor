name: RASD — Al Mal original HTML JPEG Word end-to-end — NO SEND

on:
  push:
    branches:
      - 'gate-rasd-source-hourly*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rasd-almal-e2e-shadow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-photo-to-word:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      RASD_AUTOMATION_ENABLED: 'false'
      RASD_GMAIL_APP_PASSWORD: ''
      RASD_PRIVATE_LEDGER_TOKEN: ''
      RASD_HOURLY_REPORTS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded first-party original image and Word dependencies
        run: |
          python -m pip install -r requirements-test.txt 'playwright>=1.50,<2'
          python -m playwright install --only-shell chromium
      - name: Validate no-network screenshot-refusal and Word integrity tests
        run: python -m unittest discover -s tests -p test_almal_shadow_end_to_end_no_send.py -v
      - name: Live original Al Mal page through JPEG and Word; no mail
        run: python rasd_almal_end_to_end_shadow_no_send.py
