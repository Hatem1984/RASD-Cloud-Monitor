name: Gate54 — first-party RSS request header variants (safe metadata-only)

on:
  push:
    branches:
      - gate54-publisher-rss-request-variants

permissions:
  contents: read

jobs:
  publisher-native-feed-variants:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compare bounded native publisher GET variants without content or credentials
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,time,xml.etree.ElementTree as ET
          from pathlib import Path
          from urllib.request import build_opener,Request
          from urllib.error import HTTPError,URLError
          from monitor import RejectRedirect,APPROVED_FEED_URLS
          cfg=json.loads(Path("sources.json").read_text(encoding="utf-8"))
          target=next(feed for feed in cfg["feeds"] if feed["id"]=="almasryalyoum")
          assert target["url"] in APPROVED_FEED_URLS
          user_agent="RASD-Cloud-Public-Monitor/0.1"
          variants=[
            ("baseline",{"User-Agent":user_agent}),
            ("xml_accept",{"User-Agent":user_agent,
                           "Accept":"application/rss+xml,application/xml,text/xml;q=0.9,*/*;q=0.1"}),
            ("fresh",{"User-Agent":user_agent,"Cache-Control":"no-cache","Pragma":"no-cache"}),
            ("xml_accept_fresh",{"User-Agent":user_agent,
                           "Accept":"application/rss+xml,application/xml,text/xml;q=0.9,*/*;q=0.1",
                           "Cache-Control":"no-cache","Pragma":"no-cache"}),
          ]
          seen=[]
          for label,headers in variants:
              try:
                  req=Request(target["url"],headers=headers)
                  with build_opener(RejectRedirect()).open(req,timeout=18) as rsp:
                      if rsp.status!=200 or rsp.geturl()!=target["url"]:
                          raise ValueError("bad_source_identity")
                      payload=rsp.read(cfg["max_feed_bytes"]+1)
                      if len(payload)>cfg["max_feed_bytes"]:
                          raise ValueError("bad_source_size")
                  digest=hashlib.sha256(payload).digest()
                  prev_equals=[name for name,h in seen if h==digest]
                  seen.append((label,digest))
                  try:
                      root=ET.fromstring(payload)
                      valid=(root.tag=="rss" and root.find("channel") is not None)
                      count=len(root.findall("./channel/item")) if valid else 0
                      xml_code=0
                  except ET.ParseError as err:
                      valid=False
                      count=0
                      xml_code=getattr(err,"code",0)
                  print("GATE54_VARIANT="+label+" status=200 rss_valid="+str(valid)+
                        " item_count="+str(count)+" xml_error_code="+str(xml_code)+
                        " bytes="+str(len(payload))+
                        " identical_to_earlier="+",".join(prev_equals))
              except HTTPError as err:
                  print("GATE54_VARIANT="+label+" http_status="+str(err.code))
              except (URLError,TimeoutError,ValueError,RuntimeError):
                  print("GATE54_VARIANT="+label+" source_rejected_or_unavailable=true")
              time.sleep(0.4)
          # Shadow-only: compare a publisher-owned, commonly advertised
          # singular RSS path. This MUST NOT change production sources, and a
          # snapshot intersection does NOT certify archival equivalence.
          from urllib.parse import urlsplit
          from email.utils import parsedate_to_datetime
          candidate="https://www.almasryalyoum.com/rss/rssfeed"
          assert urlsplit(candidate).hostname=="www.almasryalyoum.com"
          feeds=[]
          for label,url in [("saved_full_original",target["url"]),
                            ("publisher_singular_shadow",candidate)]:
              try:
                  with build_opener(RejectRedirect()).open(
                      Request(url,headers={"User-Agent":user_agent}),timeout=18) as rsp:
                      if rsp.status!=200 or rsp.geturl()!=url:
                          raise ValueError("redirect_or_http")
                      payload=rsp.read(cfg["max_feed_bytes"]+1)
                      if len(payload)>cfg["max_feed_bytes"]:
                          raise ValueError("oversized")
                  root=ET.fromstring(payload)
                  if root.tag!="rss":
                      raise ValueError("not_rss")
                  rows=root.findall("./channel/item")
                  ids=set()
                  valid_dates=0
                  for item in rows:
                      link=(item.findtext("link") or "").strip()
                      loc=urlsplit(link)
                      if loc.scheme=="https" and loc.hostname in (
                          "www.almasryalyoum.com","almasryalyoum.com"):
                          ids.add(hashlib.sha256(link.encode()).digest())
                      dt=(item.findtext("pubDate") or "").strip()
                      try:
                          pub=parsedate_to_datetime(dt)
                          valid_dates+=int(pub.tzinfo is not None)
                      except Exception: pass
                  feeds.append((label,ids))
                  print("GATE54_SHADOW="+label+
                        " rss_valid=True item_count="+str(len(rows))+
                        " original_host_links="+str(len(ids))+
                        " dated_items="+str(valid_dates))
              except ET.ParseError as err:
                  print("GATE54_SHADOW="+label+
                        " rss_valid=False xml_code="+str(getattr(err,"code",0)))
              except (HTTPError,URLError,TimeoutError,ValueError,RuntimeError) as err:
                  print("GATE54_SHADOW="+label+
                        " unavailable_or_redirect_rejected=True")
          if len(feeds)==2:
              print("GATE54_SHADOW_SNAPSHOT_LINK_OVERLAP="+
                    str(len(feeds[0][1]&feeds[1][1]))+
                    " current_primary_only="+str(len(feeds[0][1]-feeds[1][1]))+
                    " alternative_only="+str(len(feeds[1][1]-feeds[0][1])))
          print("GATE54_NO_ORIGINAL_CONTENT_PRINTED_NO_CONFIG_CHANGE_NO_WORD_NO_EMAIL")
          PY
