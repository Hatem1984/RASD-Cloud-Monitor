name: RASD — candidate original screenshot QA — no-send

on:
  push:
    branches:
      - 'gate-rasd-source-hourly*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rasd-firstparty-original-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate-original-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      RASD_AUTOMATION_ENABLED: 'false'
      RASD_GATE11_SEND_APPROVED: ''
      RASD_GMAIL_APP_PASSWORD: ''
      RASD_PRIVATE_LEDGER_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local Word and original publisher browser only
        run: |
          python -m pip install -r requirements-test.txt 'playwright>=1.50,<2'
          python -m playwright install --only-shell chromium
      - name: Original publisher image QA; ephemeral, no outbound mail
        run: python rasd_shadow_original_image_qa.py
