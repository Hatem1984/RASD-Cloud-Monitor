name: RASD — protected approved CC Secret check (NO SEND)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rasd-social-cc-secret-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rasd-cc-secret-visibility-no-send
  cancel-in-progress: false

jobs:
  check-cc-secret:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.actor == 'Hatem1984'))
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: rasd-production
    env:
      RASD_REPORT_CC_REQUIRED: 'true'
      # Read only from protected Secrets — never use vars.RASD_REPORT_CC.
      RASD_REPORT_CC: ${{ secrets.RASD_REPORT_CC }}
      RASD_GMAIL_SENDER: ${{ secrets.RASD_GMAIL_SENDER }}
      RASD_REPORT_TO: ${{ secrets.RASD_REPORT_TO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing offline dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Verify the protected secret matches existing owner-approved CC
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          """Read-only protected preflight: NO SMTP, no ledger, no email."""
          import os
          import re
          import sys
          from scheduled_rasd import approved_report_copy

          def hold():
              print("RASD_SOCIAL_CC_SECRET_PREFLIGHT=HOLD_NO_SEND", flush=True)
              sys.exit(2)

          sender = os.environ.get("RASD_GMAIL_SENDER", "").strip().casefold()
          primary = os.environ.get("RASD_REPORT_TO", "").strip().casefold()
          if (not re.fullmatch(r"[^@\s]+@gmail\.com", sender)
                  or not re.fullmatch(r"[^@\s]+@[^@\s]+\.[^@\s]+", primary)
                  or sender == primary
                  or os.environ.get("RASD_REPORT_CC_REQUIRED") != "true"
                  or not os.environ.get("RASD_REPORT_CC", "").strip()):
              hold()
          try:
              pinned_cc = approved_report_copy(sender, primary)
              if not pinned_cc:
                  hold()
          except (ValueError, RuntimeError, TypeError):
              hold()
          # Addresses, secret hashes, SMTP credentials and tokens are never
          # logged or persisted; the result is only a PASS/HOLD flag.
          print("RASD_SOCIAL_CC_SECRET_PREFLIGHT=PASS_NO_SEND", flush=True)
          PY
