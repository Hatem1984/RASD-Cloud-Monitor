name: RASD scheduled-workflow proposal — offline-only CI

on:
  push:
    branches:
      - 'feature/github-30min-newsroom-word-digest'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: rasd-schedule-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-security:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline Word/image libraries — no private credentials
        run: python -m pip install -r requirements-test.txt
      - name: Existing regression suite PLUS new schedule/date/state security tests
        run: python -m unittest discover -s tests -q
      - name: Safe clock-only dry run (no SMTP, no publisher requests)
        run: python scheduled_rasd.py --mode dry_run
