name: RASD — Egyptian development contextual scope research — NO SEND

on:
  push:
    branches:
      - 'gate-rasd-source-hourly*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rasd-contextual-scope-no-send-${{ github.ref }}
  cancel-in-progress: true

jobs:
  read-only-scope-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      RASD_AUTOMATION_ENABLED: 'false'
      RASD_HOURLY_REPORTS_ENABLED: 'false'
      RASD_ALMAL_ORIGINAL_HTML_ENABLED: 'false'
      RASD_YOUM7_ORIGINAL_HTML_ENABLED: 'false'
      RASD_GMAIL_APP_PASSWORD: ''
      RASD_PRIVATE_LEDGER_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare old and owner-approved expanded Egyptian planning terms using cached first-party RSS
        run: python rasd_owner_context_scope_shadow_no_send.py
