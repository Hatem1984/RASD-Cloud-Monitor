name: RASD — observed Al-Massa blank-image real QA (NO SEND)
on:
  push:
    branches:
      - 'gate-rasd-actual-blank-massa-photo-*'
permissions:
  contents: read
jobs:
  actual-original-publisher-frame:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original-page capture dependencies
        run: |
          python -m pip install -r requirements-test.txt 'playwright>=1.50,<2'
          python -m playwright install --only-shell chromium
      - name: Verify real original publisher photo or explicit HOLD without mail
        env:
          RASD_GMAIL_SENDER: ''
          RASD_GMAIL_APP_PASSWORD: ''
          RASD_REPORT_TO: ''
          RASD_REPORT_CC: ''
          RASD_PRIVATE_LEDGER_TOKEN: ''
        run: python rasd_massa_blank_photo_live_qa.py
