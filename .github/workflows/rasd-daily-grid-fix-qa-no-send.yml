name: RASD — isolated daily Word compatibility fix QA — NO SEND

on:
  push:
    branches:
      - 'fix-rasd-daily-grid-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rasd-daily-grid-fix-qa-no-send-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-daily-grid-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      RASD_AUTOMATION_ENABLED: 'false'
      RASD_HOURLY_REPORTS_ENABLED: 'false'
      RASD_DAILY_VOLUME_DELIVERY_ENABLED: 'false'
      RASD_GMAIL_APP_PASSWORD: ''
      RASD_PRIVATE_LEDGER_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline Word and screenshot audit dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run complete offline tests including pre-/post-PR190 Word layouts
        run: python -m unittest discover -s tests -q
      - name: Confirm no private network, Gmail or SMTP on this branch
        run: python scheduled_rasd.py --mode dry_run
