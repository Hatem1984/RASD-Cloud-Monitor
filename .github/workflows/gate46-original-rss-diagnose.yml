name: Gate46 — original publisher RSS HTTP diagnosis, branch-only, read-only

on:
  push:
    branches:
      - gate46-real-rss-status-probe

permissions:
  contents: read

jobs:
  source-original-http-status:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Capture only approved publisher RSS transport status, never article text
        shell: bash
        env:
          RASD_GATE11_SEND_APPROVED: ""
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from monitor import inspect
          config = json.loads(Path("sources.json").read_text())
          assert config["keywords"] == [
              "وزارة التخطيط", "وزير التخطيط", "وزيرة التخطيط",
              "التخطيط والتنمية الاقتصادية"
          ]
          assert [f["id"] for f in config["feeds"]] == [
              "hapi", "almasryalyoum"
          ]
          try:
              observed = inspect(config, now=datetime.now(timezone.utc),
                                 article_limit=15)
          except RuntimeError:
              print("RSS_DIAGNOSTIC_ALL_SOURCES_DOWN")
              raise SystemExit(0)
          for row in observed["sources"]:
              issue = row.get("error", None)
              code = row.get("http_status", None)
              assert issue is None or issue in (
                  "HTTPError", "URLError", "TimeoutError", "ValueError",
                  "ParseError", "SSLError", "OSError"
              )
              assert code is None or code in (
                  301, 302, 303, 307, 308, 400, 401, 403, 404, 408,
                  429, 500, 502, 503, 504
              )
              print("RSS_DIAGNOSTIC_SOURCE=" + row["feed_id"] +
                    ";status=" + row["status"] +
                    ";error_type=" + str(issue) +
                    ";http_status=" + str(code) +
                    ";links=" + str(row["verified_links"]))
          print("RSS_DIAGNOSTIC_NO_MAIL_NO_WORD_NO_SCHEDULE")
          PY
      - name: Probe only publisher-owned RSS candidate response type; no headline text
        shell: bash
        env:
          RASD_GATE11_SEND_APPROVED: ""
        run: |
          set -euo pipefail
          python - <<'PY'
          from urllib.request import Request, build_opener
          from urllib.error import HTTPError, URLError
          import xml.etree.ElementTree as ET
          from monitor import RejectRedirect
          URLS = (
              ("original", "https://www.almasryalyoum.com/rss/rssfeeds"),
              ("section3", "https://www.almasryalyoum.com/rss/rssfeeds?sectionId=3"),
              ("section12", "https://www.almasryalyoum.com/rss/rssfeed?sectionid=12"),
          )
          opener = build_opener(RejectRedirect())
          for label, url in URLS:
              try:
                  with opener.open(Request(url, headers={
                      "User-Agent": "RASD-Cloud-Public-Monitor/0.1",
                      "Accept": "application/rss+xml,application/xml,text/xml,*/*",
                  }), timeout=18) as response:
                      code = response.status
                      content_type = response.headers.get_content_type()
                      raw = response.read(1_500_001)
                      if response.geturl() != url or len(raw) > 1_500_000:
                          raise ValueError("unsafe_response")
                  start = raw.lstrip()[:400].lower()
                  html = start.startswith((b"<!doctype html", b"<html"))
                  try:
                      node = ET.fromstring(raw)
                      root = node.tag.rsplit("}", 1)[-1].lower()
                      count = len(node.findall("./channel/item")) if root == "rss" else 0
                      xml_ok = root == "rss"
                  except ET.ParseError:
                      root = "INVALID_XML"
                      count = 0
                      xml_ok = False
                  print("RSS_NATIVE_CANDIDATE=" + label +
                        ";status=" + str(code) +
                        ";content_type=" + str(content_type) +
                        ";bytes=" + str(len(raw)) +
                        ";html_page=" + str(html) +
                        ";rss_root=" + str(xml_ok) +
                        ";items=" + str(count))
              except HTTPError as exc:
                  print("RSS_NATIVE_CANDIDATE=" + label +
                        ";http_error=" + str(exc.code) +
                        ";no_redirect_followed=True")
              except (URLError, ValueError, TimeoutError):
                  print("RSS_NATIVE_CANDIDATE=" + label +
                        ";status=UNAVAILABLE;no_redirect_followed=True")
          print("RSS_NATIVE_DIAGNOSTIC_ONLY_NO_CONFIG_OR_SEND")
          PY
