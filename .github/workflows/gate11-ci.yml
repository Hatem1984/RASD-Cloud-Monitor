name: RASD Gate 11 — isolated branch security CI

on:
  push:
    branches:
      - main
      - 'gate*'

# Repeated housekeeping pushes need only the newest read-only CI result.
# This concurrency key never applies to manual send or protected workflows.
concurrency:
  group: rasd-readonly-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  offline-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only existing test image dependency
        run: python -m pip install -r requirements-test.txt
      - name: All offline tests; NO browser network, NO SMTP, NO secrets
        run: python -m unittest discover -s tests -v

  real-public-feed-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser with public dependencies only; no credentials
        run: |
          python -m pip install -r requirements-test.txt "playwright>=1.50,<2"
          python -m playwright install --with-deps chromium
      - name: Verify Chromium can capture a synthetic offline JPEG (NOT publisher news)
        run: python browser_runtime_probe.py
      - name: Inspect actual publisher feed with no mail and no persistent private state
        env:
          RASD_GATE11_SEND_APPROVED: ""
        shell: bash
        run: |
          set -euo pipefail
          python gate11_runner.py --mode dry_run | tee "$RUNNER_TEMP/rasd-capture-readonly.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          lines = Path(
              os.environ["RUNNER_TEMP"], "rasd-capture-readonly.json"
          ).read_text().splitlines()
          result = json.loads(lines[0])  # Following lines may be Actions warnings.
          if result["eligible"] and not result["captured"]:
              print("::warning::Publisher screenshot NOT verified: consult sanitized rejection codes; RSS and Word preview can still pass.")
          PY
      - name: Create read-only Arabic Word preview (no images, not final proof)
        env:
          RASD_GATE11_SEND_APPROVED: ""
        run: |
          python daily_report.py --output-dir report-output
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          previews = list(Path("report-output").glob("RASD-Preview-*.docx"))
          assert len(previews) == 1, "one Word preview expected"
          assert previews[0].stat().st_size > 3000
          doc = Document(previews[0])
          assert doc.paragraphs and "مسودة" in doc.paragraphs[0].text
          assert not list(Path("report-output").glob("*.pdf"))
          print("rasd_word_preview_verified; no_email; no_schedule")
          PY
      - name: Package Word-only RSS preview (NOT final screenshot-proof report)
        uses: actions/upload-artifact@v4
        with:
          name: rasd-word-preview-ci
          path: report-output/RASD-Preview-*.docx
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
