name: RASD Gate 11 — isolated branch security CI

on:
  push:
    branches:
      - gate11-secure-gmail-bridge
      - gate11-recipient-lock-and-ledger-qa
      - gate11-receipt-readback-hardening
      - gate11-protected-preflight
      - gate11-publisher-coverage-hardening
      - gate11-explicit-manual-consent
      - gate11-full-pipeline-acceptance

permissions:
  contents: read

jobs:
  offline-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only existing test image dependency
        run: python -m pip install "Pillow>=10,<13"
      - name: All offline tests; NO browser network, NO SMTP, NO secrets
        run: python -m unittest discover -s tests -v

  real-public-feed-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser with public dependencies only; no credentials
        run: |
          python -m pip install "Pillow>=10,<13" "playwright>=1.50,<2"
          python -m playwright install --with-deps chromium
      - name: Inspect actual publisher feed with no mail and no persistent private state
        env:
          RASD_GATE11_SEND_APPROVED: ""
        run: python gate11_runner.py --mode dry_run
