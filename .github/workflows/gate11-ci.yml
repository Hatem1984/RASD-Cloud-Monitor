name: RASD Gate 11 — isolated branch security CI

on:
  push:
    branches:
      - main
      - 'gate*'

# Repeated housekeeping pushes need only the newest read-only CI result.
# This concurrency key never applies to manual send or protected workflows.
concurrency:
  group: rasd-readonly-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  offline-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only existing test image dependency
        run: python -m pip install -r requirements-test.txt
      - name: All offline tests; NO browser network, NO SMTP, NO secrets
        run: python -m unittest discover -s tests -v

  real-public-feed-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser with public dependencies only; no credentials
        run: |
          python -m pip install -r requirements-test.txt "playwright>=1.50,<2"
          python -m playwright install --with-deps chromium
      - name: Verify Chromium can capture a synthetic offline JPEG (NOT publisher news)
        run: python browser_runtime_probe.py
      - name: Inspect actual publisher feed with no mail and no persistent private state
        env:
          RASD_GATE11_SEND_APPROVED: ""
        shell: bash
        run: |
          set -euo pipefail
          python gate11_runner.py --mode dry_run | tee "$RUNNER_TEMP/rasd-capture-readonly.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          result = json.loads(
              Path(os.environ["RUNNER_TEMP"], "rasd-capture-readonly.json").read_text()
          )
          if result["eligible"] and not result["captured"]:
              print("::warning::Publisher screenshot NOT verified: consult sanitized rejection codes; RSS and Word/PDF can still pass.")
          PY
      - name: Create genuine source-backed Arabic Word/PDF reports without email
        env:
          RASD_GATE11_SEND_APPROVED: ""
        run: |
          python daily_report.py --output-dir report-output
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          from pypdf import PdfReader
          docx = list(Path("report-output").glob("RASD-Daily-*.docx"))
          pdfs = list(Path("report-output").glob("RASD-Daily-*.pdf"))
          assert len(docx) == len(pdfs) == 1, "one Word and PDF expected"
          assert docx[0].stat().st_size > 3000, "Word is empty"
          assert pdfs[0].stat().st_size > 3000, "PDF is empty"
          assert Document(docx[0]).paragraphs, "Word content missing"
          assert len(PdfReader(pdfs[0]).pages) >= 1, "PDF pages missing"
          print("rasd_daily_report_word_pdf_verified; no_email; no_schedule")
          PY
      - name: Package verified public-source Word/PDF report for audit and direct download
        uses: actions/upload-artifact@v4
        with:
          name: rasd-public-report-ci
          path: |
            report-output/RASD-Daily-*.docx
            report-output/RASD-Daily-*.pdf
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
