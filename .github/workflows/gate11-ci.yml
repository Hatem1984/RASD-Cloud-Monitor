name: RASD Gate 11 — isolated branch security CI

on:
  push:
    branches:
      - main
      - 'gate*'

# Repeated housekeeping pushes need only the newest read-only CI result.
# This concurrency key never applies to manual send or protected workflows.
concurrency:
  group: rasd-readonly-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  offline-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only existing test image dependency
        run: python -m pip install -r requirements-test.txt
      - name: Housekeeping — syntax-check all tracked Python modules (NO NETWORK)
        run: python -m compileall -q .
      - name: All offline tests; NO browser network, NO SMTP, NO secrets
        run: python -m unittest discover -s tests -v

  real-public-feed-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser with public dependencies only; no credentials
        run: |
          python -m pip install -r requirements-test.txt "playwright>=1.50,<2"
          python -m playwright install --with-deps chromium
      - name: Verify Chromium can capture a synthetic offline JPEG (NOT publisher news)
        run: python browser_runtime_probe.py
      - name: Inspect actual publisher feed with no mail and no persistent private state
        env:
          RASD_GATE11_SEND_APPROVED: ""
        shell: bash
        run: |
          set -euo pipefail
          python gate11_runner.py --mode dry_run | tee "$RUNNER_TEMP/rasd-capture-readonly.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          lines = Path(
              os.environ["RUNNER_TEMP"], "rasd-capture-readonly.json"
          ).read_text().splitlines()
          result = json.loads(lines[0])  # Following lines may be Actions warnings.
          if result["eligible"] and not result["captured"]:
              print("::warning::Publisher screenshot NOT verified: consult sanitized rejection codes; RSS and Word preview can still pass.")
          PY
      - name: Gate24 — one live original publisher screenshot, strict evidence verification (NO mail)
        shell: bash
        env:
          RASD_GATE11_SEND_APPROVED: ""
        run: |
          set -euo pipefail
          python gate24_evidence_probe.py --max-attempts 1 --output-dir "$RUNNER_TEMP/rasd-g24"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          audit_dir = Path(os.environ["RUNNER_TEMP"]) / "rasd-g24"
          audit = json.loads((audit_dir / "gate24-redacted-audit.json").read_text())
          assert audit["mode"] == "gate24_real_publisher_sample_probe"
          assert audit["attempts"] <= 1
          assert audit["verified_screenshots"] <= audit["attempts"]
          assert audit["email_sent"] is False
          assert audit["scheduler_enabled"] is False
          assert audit["private_state_used"] is False
          assert audit["daily_word_created"] is False
          assert audit["all_article_images_verified"] is False
          assert not list(audit_dir.glob("*.jpg"))
          assert not list(audit_dir.glob("*.docx"))
          if audit["status"] != "SAMPLE_VERIFIED_ONLY":
              print("::warning::Gate24: authentic publisher screenshot not yet verified. No final Word, no email.")
          else:
              print("Gate24 SAMPLE evidence passed; full daily Word still NOT accepted.")
          PY
      - name: Gate31 — genuine full-source Word proof acceptance (QA branch only; no evidence uploaded)
        if: startsWith(github.ref, 'refs/heads/gate31-')
        shell: bash
        env:
          RASD_GATE11_SEND_APPROVED: ""
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import tempfile
          from pathlib import Path
          from docx import Document
          from cloud_proof_report import build_proof_report, word_images_match_capture_digests

          # Entire full-source report and real screenshots exist only in
          # ephemeral runner storage. No public Word/photo artifact or email.
          with tempfile.TemporaryDirectory(prefix="rasd-g31-") as tmp:
              folder = Path(tmp)
              result = build_proof_report(Path("sources.json"), folder)
              audit = {
                  "gate": 31,
                  "status": result["status"],
                  "coverage": result["coverage"],
                  "articles": result["articles"],
                  "screenshots_verified": result["screenshots_verified"],
                  "screenshots_missing": result["screenshots_missing"],
                  "word_created": result["word_created"],
                  "email_sent": result["email_sent"],
                  "scheduler_enabled": result["scheduler_enabled"],
              }
              print(json.dumps(audit, sort_keys=True), flush=True)
              words = list(folder.glob("RASD-Daily-*.docx"))
              if result["status"] != "READY":
                  assert not words, "HOLD must never leave final Word"
                  print("::error::Gate31 full-source screenshot proof HOLD; "
                        "no final Word exported, no email or schedule", flush=True)
                  raise SystemExit(2)
              assert result["coverage"] == "HEALTHY"
              assert result["articles"] >= 1
              assert result["screenshots_verified"] == result["articles"]
              assert result["screenshots_missing"] == 0
              assert len(words) == 1
              assert len(Document(words[0]).inline_shapes) == result["articles"]
              assert word_images_match_capture_digests(words[0], result["entries"])
              print("GATE31_FULL_SOURCE_EPHEMERAL_WORD_PROOF_VERIFIED; "
                    "NO_PUBLIC_DOCX; NO_EMAIL; NO_SCHEDULE", flush=True)
          PY
      - name: Gate38 — official Ministry original page + archive discovery QA (branch-only, no mail)
        if: github.ref == 'refs/heads/gate38-official-ministry-original-source'
        shell: bash
        env:
          RASD_GATE11_SEND_APPROVED: ""
        run: |
          set -euo pipefail
          python official_ministry_source.py | tee "$RUNNER_TEMP/rasd-g38-redacted.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          rows = (Path(os.environ["RUNNER_TEMP"]) /
                  "rasd-g38-redacted.json").read_text().splitlines()
          audit = json.loads(rows[0])
          assert audit["mode"] == "official_ministry_optin_qa"
          assert audit["production_feed_changed"] is False
          assert audit["keywords_changed"] is False
          assert audit["source_added_to_production"] is False
          assert audit["final_report_published"] is False
          assert audit["email_sent"] is False
          assert audit["scheduler_enabled"] is False
          assert audit["private_archive_used"] is False
          assert audit["sample_verified_screenshots"] in (0, 1)
          if audit["status"] != "READY_SOURCE_QA_ONLY":
              print("::warning::GATE38 SOURCE HOLD — official index and full "
                    "original-page proof have not BOTH passed. No source promoted.")
          else:
              assert audit["official_index"] == "FOUND"
              assert audit["sample_verified_screenshots"] == 1
              assert audit["sample_word_images_verified"] is True
              print("GATE38 official source QUALIFIED FOR REVIEW ONLY; "
                    "production promotion separately gated")
          PY
      - name: Gate39 — independently repeat original Ministry NewsList discovery and screenshot Word (no delivery)
        if: github.ref == 'refs/heads/gate39-official-homepage-discovery'
        shell: bash
        env:
          RASD_GATE11_SEND_APPROVED: ""
        run: |
          set -euo pipefail
          python official_ministry_source.py | tee "$RUNNER_TEMP/gate39-ministry-audit.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          audit = json.loads((Path(os.environ["RUNNER_TEMP"]) /
                              "gate39-ministry-audit.json").read_text().splitlines()[0])
          assert audit["source_added_to_production"] is False
          assert audit["keywords_changed"] is False
          assert audit["email_sent"] is False
          assert audit["scheduler_enabled"] is False
          assert audit["final_report_published"] is False
          if audit["status"] != "READY_SOURCE_QA_ONLY":
              print("::error::Stage1 official Ministry auto-discovery HOLD")
              raise SystemExit(2)
          assert audit["official_index"] == "FOUND"
          assert audit["index_repeat_confirmed"] is True
          assert audit["index_article_links"] >= 1
          assert audit["sample_origin"] == "official_NewsList_card_discovery_only"
          assert audit["sample_verified_screenshots"] == 1
          assert audit["sample_word_images_verified"] is True
          print("GATE39_OFFICIAL_ORIGINAL_NEWSLIST_AUTO_DISCOVERY_AND_WORD_VERIFIED")
          PY
      - name: Gate40 — full three-source Word with verified original screenshots, private ephemeral QA
        if: github.ref == 'refs/heads/gate40-unified-ministry-word-acceptance'
        shell: bash
        env:
          RASD_GATE11_SEND_APPROVED: ""
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rasd-stage2-unified"
          python unified_ministry_word.py --target-day 2026-10-17 \
            --output-dir "$RUNNER_TEMP/rasd-stage2-unified" \
            | tee "$RUNNER_TEMP/rasd-stage2-audit.log"
          python - <<'PY'
          import json, os
          from pathlib import Path
          from docx import Document
          output = Path(os.environ["RUNNER_TEMP"]) / "rasd-stage2-unified"
          audit = json.loads((Path(os.environ["RUNNER_TEMP"]) /
                              "rasd-stage2-audit.log").read_text().splitlines()[0])
          assert audit["mode"] == "stage2_ministry_unified_word_ephemeral_qa"
          assert audit["rss_source_count"] == 2
          assert audit["official_source_count"] == 1
          assert audit["date_only_official_not_assigned_hour"] is True
          assert audit["production_sources_changed"] is False
          assert audit["keywords_changed"] is False
          assert audit["source_added_to_production"] is False
          assert audit["final_report_published"] is False
          assert audit["email_sent"] is False
          assert audit["scheduler_enabled"] is False
          assert audit["private_storage_used"] is False
          assert audit["production_15_item_cap_intact"] is True
          words = list(output.glob("*.docx"))
          if audit["status"] == "READY_QA_ONLY":
              assert audit["all_sources_healthy"] is True
              assert audit["selected_unique_articles"] >= 1
              assert audit["screenshots_verified"] == audit["selected_unique_articles"]
              assert audit["screenshots_missing"] == 0
              assert audit["word_images_verified"] is True
              assert len(words) == 1
              assert len(Document(words[0]).inline_shapes) == audit["selected_unique_articles"]
              print("GATE40_UNIFIED_MINISTRY_AND_RSS_REAL_WORD_SHA_READY_QA_ONLY")
          else:
              assert audit["status"] == "HOLD"
              assert not words, "HOLD must not leave partial Word"
              print("::warning::GATE40_UNIFIED_MINISTRY_WORD_HOLD: no incomplete final Word or delivery")
          PY
      - name: Gate41 — real multi-page official archive cutoff and all-source Word QA
        if: github.ref == 'refs/heads/gate41-official-paginated-coverage'
        shell: bash
        env:
          RASD_GATE11_SEND_APPROVED: ""
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rasd-stage2-paginated"
          python unified_ministry_word.py --target-day 2026-10-17 \
            --output-dir "$RUNNER_TEMP/rasd-stage2-paginated" \
            | tee "$RUNNER_TEMP/rasd-stage2-paginated-audit.log"
          python - <<'PY'
          import json, os
          from pathlib import Path
          from docx import Document
          root = Path(os.environ["RUNNER_TEMP"])
          audit = json.loads((root / "rasd-stage2-paginated-audit.log").read_text().splitlines()[0])
          words = list((root / "rasd-stage2-paginated").glob("*.docx"))
          assert audit["mode"] == "stage2_ministry_unified_word_ephemeral_qa"
          assert audit["production_sources_changed"] is False
          assert audit["keywords_changed"] is False
          assert audit["source_added_to_production"] is False
          assert audit["email_sent"] is False
          assert audit["scheduler_enabled"] is False
          assert audit["private_storage_used"] is False
          assert audit["final_report_published"] is False
          assert audit["production_15_item_cap_intact"] is True
          if audit["status"] == "READY_QA_ONLY":
              assert audit["official_pages_checked"] >= 2
              assert audit["official_pagination_complete"] is True
              assert audit["official_pagination_termination"] in ("EMPTY_PAGE", "OLDER_THAN_TARGET")
              assert audit["all_sources_healthy"] is True
              assert audit["screenshots_verified"] == audit["selected_unique_articles"]
              assert audit["screenshots_missing"] == 0
              assert audit["word_images_verified"] is True
              assert len(words) == 1
              assert len(Document(words[0]).inline_shapes) == audit["selected_unique_articles"]
              print("GATE41_PAGINATED_ORIGINAL_MINISTRY_WORD_SHA_VERIFIED_QA_ONLY")
          else:
              assert audit["status"] == "HOLD"
              assert not words
              print("::warning::GATE41_PAGINATION_HOLD: external source unavailable or evidence incomplete; no Word. CI safety behavior correct, real acceptance NOT approved.")
          PY
      - name: Gate42 — install private render tools (only QA branch, no artifact)
        if: github.ref == 'refs/heads/gate42-word-layout-and-live-windows'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libreoffice-writer poppler-utils fonts-dejavu-core fonts-noto-core
          libreoffice --version
      - name: Gate42 — synthetic Word visual-render preflight (NOT live publisher proof)
        if: github.ref == 'refs/heads/gate42-word-layout-and-live-windows'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys, tempfile
          from pathlib import Path
          sys.path.insert(0, "tests")
          from test_gate42_word_image_layout import fixture_image, minimal_report
          from daily_report import render_docx
          from word_render_audit import rendered_word_preflight
          with tempfile.TemporaryDirectory(prefix="rasd-synthetic-render-only-") as scratch:
              root = Path(scratch)
              tall = root / "synthetic-tall.jpg"
              wide = root / "synthetic-wide.jpg"
              fixture_image(tall, 1200, 4700)
              fixture_image(wide, 1200, 900)
              output = root / "synthetic-layout.docx"
              render_docx(minimal_report([tall, wide]), output)
              audit = rendered_word_preflight(output, expected_articles=2)
              assert audit["status"] == "RENDER_CHECK_PASSED_NOT_HUMAN_REVIEW"
              assert audit["human_visual_review"] is False
              assert audit["ephemeral_render_destroyed"] is True
              print("SYNTHETIC_WORD_RENDER_QA_ONLY; " + str(audit))
          PY
      - name: Gate42 — yesterday and today genuine original publisher Word + rendered page QA
        if: github.ref == 'refs/heads/gate42-word-layout-and-live-windows'
        env:
          RASD_GATE11_SEND_APPROVED: ""
        shell: bash
        run: |
          set -euo pipefail
          for day in "$(TZ=Africa/Cairo date -d yesterday +%Y-%m-%d)" \
                     "$(TZ=Africa/Cairo date +%Y-%m-%d)"; do
            folder="$RUNNER_TEMP/rasd-g42-$day"
            mkdir -p "$folder"
            python unified_ministry_word.py --target-day "$day" --output-dir "$folder" \
              | tee "$RUNNER_TEMP/rasd-g42-$day.json"
            python - "$day" "$folder" <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          target = sys.argv[1]
          folder = Path(sys.argv[2])
          audit = json.loads((folder.parent / ("rasd-g42-" + target + ".json")).read_text().splitlines()[0])
          assert audit["mode"] == "stage2_ministry_unified_word_ephemeral_qa"
          assert audit["email_sent"] is False and audit["scheduler_enabled"] is False
          assert audit["source_added_to_production"] is False
          assert audit["private_storage_used"] is False
          assert audit["final_report_published"] is False
          assert audit["keywords_changed"] is False and audit["production_sources_changed"] is False
          words = list(folder.glob("*.docx"))
          if audit["status"] == "READY_QA_ONLY":
              assert audit["all_sources_healthy"]
              assert audit["official_pagination_complete"]
              assert audit["word_images_verified"]
              assert audit["screenshots_missing"] == 0
              assert len(words) == 1
              subprocess.run([
                  sys.executable, "word_render_audit.py", str(words[0]),
                  "--articles", str(audit["selected_unique_articles"]),
              ], check=True)
              print("GATE42_REAL_WORD_RENDER_PREFLIGHT_OK; NOT HUMAN APPROVAL; DATE=" + target)
          else:
              assert audit["status"] == "HOLD"
              assert not words, "Never retain a partial Word"
              print("::warning::GATE42_SOURCE_OR_EVIDENCE_HOLD; NO_WORD; DATE=" + target)
          PY
          done
          echo "Two independent local Cairo dates checked; today is a partial-day window, not a full-day delivery acceptance."
      - name: Create read-only Arabic Word preview (no images, not final proof)
        env:
          RASD_GATE11_SEND_APPROVED: ""
        run: |
          # Public pilot after 08:00 Cairo: exact same-day window, at most 20.
          # Before 08:00, retain the safe historical 24-hour read-only preview.
          cairo_hour="$(TZ=Africa/Cairo date +%H)"
          if [ "$cairo_hour" -ge 8 ]; then
            cairo_start="$(TZ=Africa/Cairo date +%Y-%m-%dT08:00)"
            python daily_report.py --output-dir report-output \
              --start-cairo "$cairo_start" --max-articles 20
          else
            python daily_report.py --output-dir report-output
          fi
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          previews = list(Path("report-output").glob("RASD-Preview-*.docx"))
          assert len(previews) == 1, "one Word preview expected"
          assert previews[0].stat().st_size > 3000
          doc = Document(previews[0])
          assert doc.paragraphs and "مسودة" in doc.paragraphs[0].text
          assert not list(Path("report-output").glob("*.pdf"))
          print("rasd_word_preview_verified; no_email; no_schedule")
          PY
      - name: Privacy guard — do not upload any Word, JPEG or publisher images to public Actions
        shell: bash
        run: |
          set -euo pipefail
          # Preview may be rendered and QA-checked in the temporary runner,
          # but public GitHub Actions artifacts must not contain Word or photos.
          test -d report-output
          test "$(find report-output -name '*.pdf' | wc -l)" -eq 0
          echo "No public Word/JPEG/image artifacts uploaded; ephemeral preview only"
