name: RASD — actual source original-page photo QA — NO SEND

on:
  push:
    branches:
      - 'qa-rasd-source-capture-expansion-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rasd-qa-real-original-photo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-original-photo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RASD_AUTOMATION_ENABLED: 'false'
      RASD_HOURLY_REPORTS_ENABLED: 'false'
      RASD_GMAIL_APP_PASSWORD: ''
      RASD_PRIVATE_LEDGER_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install first-party original photo browser tools
        run: |
          python -m pip install -r requirements-test.txt 'playwright>=1.50,<2'
          python -m playwright install --only-shell chromium
      - name: Recheck real local news screenshots and original date metadata, no mail
        run: python rasd_live_new_source_photo_no_send.py
      - name: Research only non-approved Al Masdar genuine original-page photo (no activation)
        run: python rasd_almasdar_original_screenshot_research_no_send.py
