name: RASD Arabic Word-only NEWS PREVIEW — manual (not final proof)

on:
  workflow_dispatch:

# The reports include only publicly published RSS headlines and original URLs.
# No mail, no secret, no private state, no schedule, no external browser automation.
permissions:
  contents: read

concurrency:
  group: rasd-manual-public-daily-digest
  cancel-in-progress: false

jobs:
  generate-word-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only Word report dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Generate clearly labelled Arabic Word preview; NOT a final screenshot-verified report
        env:
          RASD_GATE11_SEND_APPROVED: ""
        run: python daily_report.py --output-dir report-output
      - name: Verify exactly one Word preview and no final report claim
        run: |
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          previews = list(Path("report-output").glob("RASD-Preview-*.docx"))
          assert len(previews) == 1, "expected exactly one Word preview"
          assert previews[0].stat().st_size > 3000
          document = Document(previews[0])
          assert document.paragraphs
          assert "مسودة" in document.paragraphs[0].text
          assert not list(Path("report-output").glob("*.pdf"))
          print("rasd_word_preview_verified; not_final; no_email; no_schedule")
          PY
      - name: Privacy guard — Word preview stays in ephemeral runner
        shell: bash
        run: |
          test "$(find report-output -type f -name '*.pdf' | wc -l)" -eq 0
          echo "Word preview verified privately; no public document upload."
