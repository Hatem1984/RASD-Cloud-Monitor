name: RASD — corrected Alborsa original RSS direct-URL acceptance (NO SEND)
on:
  push:
    branches:
      - 'gate-rasd-alborsa-direct-feed-*'
permissions:
  contents: read
jobs:
  strict-original-rss:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline first-party host, redirect, and active source invariants
        run: python -m unittest discover -s tests -p test_alborsa_direct_feed.py -v
      - name: Revalidate approved original Alborsa RSS on exact canonical URL (NO SEND)
        env:
          RASD_GMAIL_SENDER: ''
          RASD_REPORT_TO: ''
          RASD_REPORT_CC: ''
          RASD_PRIVATE_LEDGER_TOKEN: ''
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from monitor import read_feed, parse_rss
          cfg = json.loads(Path("sources_newsroom_active.json").read_text(encoding="utf-8"))
          feed = next(f for f in cfg["feeds"] if f["id"] == "alborsa")
          raw = read_feed(feed["url"], cfg["max_feed_bytes"])
          original, matches = parse_rss(raw, feed, cfg["keywords"],
                                        datetime.now(timezone.utc),
                                        cfg["recent_hours"], require_complete_items=True)
          from xml.etree import ElementTree as ET
          from email.utils import parsedate_to_datetime
          from urllib.parse import urlsplit
          from urllib.request import Request, build_opener
          from html.parser import HTMLParser
          from monitor import RejectRedirect
          rows = ET.fromstring(raw).findall("./channel/item")
          def identity(url):
              p = urlsplit(url)
              if p.scheme != "https" or p.hostname not in feed["allowed_article_hosts"]:
                  return None
              return p.path.rstrip("/").split("/")[-1]
          targets = {
              "2008756":"https://alborsaanews.com/2026/11/24/2008756",
              "2009038":"https://alborsaanews.com/2026/11/25/2009038",
              "2009145":"https://alborsaanews.com/2026/11/25/2009145",
          }
          ids = {identity((n.findtext("link") or "").strip()) for n in rows}
          matched_ids = {identity(x["url"]) for x in matches}
          stamps = []
          for n in rows:
              try:
                  d = parsedate_to_datetime(n.findtext("pubDate"))
                  if d.tzinfo is not None:
                      stamps.append(d.astimezone(timezone.utc))
              except (ValueError, TypeError, AttributeError):
                  pass
          print(json.dumps({"mode":"bounded_original_inventory", "links":len(rows),
                            "oldest":min(stamps).isoformat() if stamps else None,
                            "newest":max(stamps).isoformat() if stamps else None,
                            "targets":{k:{"in_feed":k in ids,"matched":k in matched_ids} for k in targets},
                            "email_sent":False}))
          class Metadata(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.values={}
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=="meta" and a.get("property") in ("og:url","og:title","article:published_time"):
                      self.values[a["property"]]=a.get("content")
          for k,url in targets.items():
              try:
                  with build_opener(RejectRedirect()).open(Request(url,headers={"User-Agent":"RASD-Cloud-Public-Monitor/0.1"}), timeout=12) as response:
                      if response.status!=200 or response.geturl()!=url:
                          raise RuntimeError("identity_or_http")
                      data=response.read(2000001)
                      if len(data)>2000000:
                          raise RuntimeError("size")
                  p=Metadata(); p.feed(data.decode("utf-8","strict"))
                  print(json.dumps({"mode":"original_article_metadata","id":k,
                                    "http_ok":True,"canonical_matches":identity(p.values.get("og:url") or "")==k,
                                    "publisher_date":p.values.get("article:published_time"),
                                    "title_present":bool(p.values.get("og:title")),"email_sent":False}))
              except Exception as e:
                  print(json.dumps({"mode":"original_article_metadata","id":k,"http_ok":False,
                                    "error_type":type(e).__name__,"email_sent":False}))
          # Public publisher discovery only: no guessed article IDs, no private state.
          import re
          from urllib.parse import urljoin
          class Listing(HTMLParser):
              def __init__(self,base):
                  super().__init__()
                  self.base=base; self.links=set(); self.feeds=set(); self.api=set(); self.sections=set(); self.next=set()
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs); raw=a.get("href")
                  if not raw: return
                  u=urljoin(self.base,raw); p=urlsplit(u)
                  if p.scheme!="https" or p.hostname not in feed["allowed_article_hosts"] or p.username or p.password or p.port not in (None,443): return
                  if re.fullmatch(r"/20[0-9]{2}/[0-9]{2}/[0-9]{2}/[0-9]+/?",p.path): self.links.add(p.path)
                  if tag=="link" and a.get("type") in ("application/rss+xml","application/atom+xml") and len(u)<500: self.feeds.add(u)
                  if tag=="link" and a.get("rel")=="https://api.w.org/" and len(u)<500: self.api.add(u)
                  if p.path.startswith("/category/") and len(u)<500: self.sections.add(u)
                  if "next" in (a.get("rel") or "").split() and len(u)<500: self.next.add(u)
          def get_public(url,limit=3000000):
              with build_opener(RejectRedirect()).open(Request(url,headers={"User-Agent":"RASD-Cloud-Public-Monitor/0.1"}),timeout=15) as response:
                  if response.status!=200 or response.geturl()!=url: raise RuntimeError("identity_or_http")
                  data=response.read(limit+1)
                  if len(data)>limit: raise RuntimeError("size")
                  return data
          discovered_feeds=set()
          for url in ["https://alborsaanews.com/","https://alborsaanews.com/latestnews"]:
              try:
                  p=Listing(url);p.feed(get_public(url).decode("utf-8","strict"))
                  discovered_feeds.update(p.feeds)
                  print(json.dumps({"mode":"publisher_listing","url":url,"article_links":len(p.links),"targets":{k:any(x.rstrip("/").endswith("/"+k) for x in p.links) for k in targets},"feeds":sorted(p.feeds)[:10],"api":sorted(p.api)[:3],"sections":sorted(p.sections)[:25],"next":sorted(p.next)[:4],"email_sent":False}))
              except Exception as e:
                  print(json.dumps({"mode":"publisher_listing","url":url,"error_type":type(e).__name__,"email_sent":False}))
          # The publisher's own article pages may declare the exact category RSS link.
          for k,url in targets.items():
              try:
                  p=Listing(url);p.feed(get_public(url).decode("utf-8","strict"));discovered_feeds.update(p.feeds)
                  print(json.dumps({"mode":"publisher_article_navigation","id":k,"feeds":sorted(p.feeds)[:10],"api":sorted(p.api)[:3],"sections":sorted(p.sections)[:25],"email_sent":False}))
              except Exception as e:
                  print(json.dumps({"mode":"publisher_article_navigation","id":k,"error_type":type(e).__name__}))
          # Only discovered publisher-declared general news RSS (not comments).
          for url in sorted(discovered_feeds)[:6]:
              if "/comments/" in url or "?feed=comments" in url: continue
              try:
                  raw2=get_public(url,1500000)
                  if b"<!DOCTYPE" in raw2.upper() or b"<!ENTITY" in raw2.upper():raise ValueError("unsafe_xml")
                  root=ET.fromstring(raw2)
                  if root.tag.rsplit("}",1)[-1]!="rss" or root.find("channel") is None:raise ValueError("not_rss")
                  nodes=root.findall("./channel/item")
                  links={identity((n.findtext("link") or "").strip()) for n in nodes}
                  print(json.dumps({"mode":"publisher_declared_feed","url":url,"items":len(nodes),"targets":{k:k in links for k in targets},"email_sent":False}))
              except Exception as e:
                  print(json.dumps({"mode":"publisher_declared_feed","url":url,"error_type":type(e).__name__,"email_sent":False}))
          if not original or original > 500:
              raise RuntimeError("alborsa_native_xml_content_hold")
          print(json.dumps({"mode":"alborsa_first_party_original_RSS_QA",
                            "feed_id":"alborsa","status":"DIRECT_STRICT_RSS_QA_ONLY",
                            "original_links":original,
                            "planning_keyword_matches":len(matches),
                            "screenshots_verified":0,
                            "production_activated":False,"email_sent":False}))
          PY
