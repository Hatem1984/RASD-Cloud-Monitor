name: RASD Gate 11 — secure Gmail bridge (manual, default DRY RUN)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Dry run has NO Gmail/private-ledger access. Send requires separate explicit approval and protected environment."
        required: true
        type: choice
        options:
          - dry_run
          - send
        default: dry_run

# No cron, push, PR or repository_dispatch triggers.
permissions:
  contents: read

concurrency:
  group: rasd-gate11-email-serialization
  cancel-in-progress: false

jobs:
  dry-run:
    if: github.ref == 'refs/heads/main' && inputs.mode == 'dry_run'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install capture/test dependencies
        run: |
          python -m pip install "Pillow>=10,<13" "playwright>=1.50,<2"
          python -m playwright install --with-deps chromium
      - name: Run all offline tests including Gate 11
        run: python -m unittest discover -s tests -v
      - name: Real RSS scan; NO SMTP/private ledger/historical fixtures
        env:
          RASD_GATE11_SEND_APPROVED: ""
        run: python gate11_runner.py --mode dry_run

  send:
    # Disabled until approval AND protected environment secrets are provisioned.
    if: github.ref == 'refs/heads/main' && inputs.mode == 'send'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: rasd-gmail-manual-approval
    env:
      RASD_GATE11_SEND_APPROVED: ${{ secrets.RASD_GATE11_SEND_APPROVED }}
      RASD_GMAIL_USER: ${{ secrets.RASD_GMAIL_USER }}
      RASD_APPROVED_RECIPIENT: ${{ secrets.RASD_APPROVED_RECIPIENT }}
      RASD_GMAIL_APP_PASSWORD: ${{ secrets.RASD_GMAIL_APP_PASSWORD }}
      RASD_PRIVATE_LEDGER_TOKEN: ${{ secrets.RASD_PRIVATE_LEDGER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install capture/test dependencies
        run: |
          python -m pip install "Pillow>=10,<13" "playwright>=1.50,<2"
          python -m playwright install --with-deps chromium
      - name: Verify offline safety before any live delivery
        run: python -m unittest discover -s tests -v
      - name: New publisher-verified images with private SMTP receipt
        run: python gate11_runner.py --mode send
