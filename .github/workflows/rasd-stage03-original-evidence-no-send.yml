name: RASD Stage 03 original evidence sample (NO SEND)
on:
  push:
    branches: ['gate-rasd-stage03-original-evidence-no-send-20261126']
permissions:
  contents: read
jobs:
  evidence-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing QA dependencies
        run: |
          python -m pip install -r requirements-test.txt "playwright>=1.50,<2"
          python -m playwright install --only-shell chromium
      - name: Original Alborsa and institute screenshot sample, official original page
        run: |
          python - <<'PY'
          import subprocess,json,tempfile,shutil
          from datetime import datetime,timezone
          from pathlib import Path
          from monitor import inspect
          from alborsa_original_listing import audit_listing
          from cloud_proof_report import proof_capture,word_images_match_capture_digests
          from capture_public import capture_publisher
          from gate11_runner import candidate_from_feed,SAFE_CAPTURE_FAILURE_CODES
          from daily_report import render_docx,CAIRO
          from official_ministry_source import discover_official_newslist,allowed_official_resource,original_publication_date,_read_original
          from rasd_official_daily import APPROVED_WORDS
          from playwright.sync_api import sync_playwright
          base="49315ff28b325c33ec729b79593d51f494fbcf44"
          assert subprocess.check_output(["git","diff","--name-only",base,"HEAD"],text=True).splitlines()==[".github/workflows/rasd-stage03-original-evidence-no-send.yml"]
          cfg=json.loads(Path("sources_newsroom_active.json").read_text(encoding="utf-8"))
          now=datetime.now(timezone.utc)
          native=inspect(cfg,now=now,article_limit=200,require_complete_items=True)
          feeds={f["id"]:f for f in cfg["feeds"]}
          targets={"2008756","2009038","2009145"}
          articles=[]
          try:
              a=audit_listing(cfg["keywords"],now)
              print(json.dumps({"mode":"alborsa_original_inventory","links":a["links"],"holds":a["holds"],"verified":len(a["verified"]),"boundary":a["boundary"]}))
              for row in a["verified"]:
                  if row["url"].rsplit("/",1)[-1] in targets:
                      articles.append(("alborsa",{**row,"source":feeds["alborsa"]["name"]}))
          except Exception as e:
              print(json.dumps({"mode":"alborsa_original_inventory","status":"HOLD","error_type":type(e).__name__}))
          for row in native["matched_public_articles"]:
              if row["source"]==feeds["inp_official"]["name"]:
                  articles.append(("inp_official",row));break
          receipts=[];stories=[]
          with tempfile.TemporaryDirectory(prefix="rasd-stage03-") as d:
              out=Path(d)
              for i,(source,row) in enumerate(articles):
                  candidate=candidate_from_feed(row,cfg,now)
                  if candidate is None:
                      print(json.dumps({"mode":"original_image","source":source,"status":"HOLD","reason":"candidate_invalid"}));continue
                  path=out/f"original-{i}.jpg"
                  raw_path=out/f"browser-{i}.jpg"
                  raw=capture_publisher(candidate["url"],candidate["publisher"],raw_path)
                  def same_capture(url,publisher,destination):
                      if raw.get("ok"): shutil.copyfile(raw_path,destination)
                      return raw
                  proof=proof_capture(candidate,cfg["feeds"],path,capture=same_capture)
                  reason=proof.get("reason")
                  allowed=set(SAFE_CAPTURE_FAILURE_CODES)|{"missing_original_headline","original_headline_out_of_frame","original_headline_not_in_article","visual_qa_suspicious_flat_original_lead_media","screenshot_digest_mismatch"}
                  raw_reason=raw.get("reason")
                  print(json.dumps({"mode":"original_image","source":source,"sample_id":candidate["url"].rsplit("/",1)[-1] if source=="alborsa" else None,"status":proof["status"],"reason":reason if reason in allowed else ("other" if reason else None),"browser_reason":raw_reason if raw_reason in allowed else ("accepted" if raw.get("ok") else "other")}))
                  if proof["status"]=="verified":
                      from email.utils import parsedate_to_datetime
                      dt=parsedate_to_datetime(candidate["published"]).astimezone(CAIRO)
                      stories.append({**candidate,"published_at_cairo":dt.strftime("%Y-%m-%d %H:%M %Z"),"published_display_cairo":dt.isoformat(),"evidence_image_path":str(path)})
                      receipts.append(proof)
              if stories:
                  word=out/"qa.docx"
                  render_docx({"title":"RASD Stage 03 QA ONLY","display_window_start":"QA sample","display_window_end":"QA sample","coverage":"SOURCE_LIMITED","verified_links":len(stories),"articles":stories,"sources":[],"limitations":"Read-only sample; no delivery"},word)
                  print(json.dumps({"mode":"sample_word","verified_images":len(receipts),"ordered_image_digests_match":word_images_match_capture_digests(word,receipts)}))
              with sync_playwright() as p:
                  b=p.chromium.launch(headless=True,args=["--no-sandbox","--disable-dev-shm-usage"])
                  try:
                      ctx=b.new_context(viewport={"width":1200,"height":900},locale="ar-EG",ignore_https_errors=False,accept_downloads=False,service_workers="block")
                      ctx.route("**/*",lambda r:r.continue_() if allowed_official_resource(r.request.url) else r.abort())
                      urls=discover_official_newslist(ctx.request,max_articles=35)
                      page=ctx.new_page()
                      url=urls[0]
                      resp=page.goto(url,wait_until="domcontentloaded",timeout=24000)
                      h=" ".join(page.locator("h1").first.inner_text(timeout=8000).split())
                      dt=original_publication_date(page.locator("body").inner_text(timeout=8000),h)
                      if dt is None:
                          print(json.dumps({"mode":"official_original","status":"HOLD","reason":"publisher_date_missing"}))
                      else:
                          q=_read_original(page,url,APPROVED_WORDS,dt,out/"official.jpg")
                          print(json.dumps({"mode":"official_original","status":q["status"],"published_date":dt.isoformat(),"reason":q.get("reason"),"listing_links":len(urls)}))
                  finally:b.close()
          print(json.dumps({"mode":"stage03_sample_summary","attempted":len(articles),"verified":len(receipts),"email_sent":False,"private_state_used":False,"artifact_uploaded":False}))
          PY
