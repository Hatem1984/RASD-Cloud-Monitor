name: RASD — blocked publisher image asset diagnostics — NO SEND

on:
  push:
    branches:
      - 'qa-rasd-source-capture-expansion-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rasd-qa-publisher-media-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-media-hosts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RASD_AUTOMATION_ENABLED: 'false'
      RASD_GMAIL_APP_PASSWORD: ''
      RASD_PRIVATE_LEDGER_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chromium and limited read-only image probe dependencies
        run: |
          python -m pip install -r requirements-test.txt 'playwright>=1.50,<2'
          python -m playwright install --only-shell chromium
      - name: Inspect denied publisher image asset hosts without fetching them or changing source approval
        run: python rasd_publisher_media_origin_diagnostic_no_send.py
