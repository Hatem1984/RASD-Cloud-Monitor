name: RASD — strict 10 diverse fresh hourly sources — NO SEND

on:
  push:
    branches: ['gate-rasd-source-hourly-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rasd-10-source-hourly-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strict-hourly-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      RASD_AUTOMATION_ENABLED: 'false'
      RASD_HOURLY_REPORTS_ENABLED: 'false'
      RASD_GMAIL_APP_PASSWORD: ''
      RASD_PRIVATE_LEDGER_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline Word/photograph dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Test strict ten source freshness including DST, duplicates and images
        run: python -m unittest discover -s tests -p 'test_strict_ten_fresh_ten_publishers_no_send.py' -v
      - name: Test entire hourly and daily RASD regression suite
        run: python -m unittest discover -s tests -q
      - name: No network or mail schedule check
        run: python scheduled_rasd.py --mode dry_run
