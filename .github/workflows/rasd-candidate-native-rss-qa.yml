name: RASD — candidate native first-party newsroom RSS (NO SEND)
on:
  push:
    branches:
      - 'gate-rasd-new-publishers-realsource-*'
permissions:
  contents: read
jobs:
  original-source-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline fail-closed candidate source tests
        run: python -m unittest discover -s tests -p test_candidate_native_rss_qa.py -v
      - name: Fetch at most four reviewed original feeds (no send)
        env:
          RASD_GMAIL_SENDER: ''
          RASD_GMAIL_APP_PASSWORD: ''
          RASD_REPORT_TO: ''
          RASD_REPORT_CC: ''
          RASD_PRIVATE_LEDGER_TOKEN: ''
        run: python rasd_candidate_native_rss_qa.py
