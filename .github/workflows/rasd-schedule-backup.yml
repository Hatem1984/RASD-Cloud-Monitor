name: RASD — independent backup production scheduler

on:
  schedule:
    # A separate GitHub workflow, offset from the main workflow schedule.
    # These are EXTRA opportunities to recover missed intervals, not an SLA.
    - cron: '13,43 * * * *'

permissions:
  contents: read

# EXACT same repository-scoped concurrency as the main production monitor.
# No overlapping private CAS or duplicate SMTP across either schedule.
concurrency:
  group: rasd-scheduled-monitor-private-ledger
  cancel-in-progress: false

jobs:
  protected-backup-scheduled-monitor:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'schedule' &&
      github.event.schedule == '13,43 * * * *' &&
      vars.RASD_AUTOMATION_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    environment: rasd-production
    env:
      RASD_AUTOMATION_ENABLED: 'true'
      RASD_DAILY_SENT_ARCHIVE_ENABLED: 'true'
      RASD_JOB_CRON: ${{ github.event.schedule }}
      RASD_GMAIL_SENDER: ${{ secrets.RASD_GMAIL_SENDER }}
      RASD_REPORT_TO: ${{ secrets.RASD_REPORT_TO }}
      RASD_GMAIL_APP_PASSWORD: ${{ secrets.RASD_GMAIL_APP_PASSWORD }}
      RASD_PRIVATE_LEDGER_TOKEN: ${{ secrets.RASD_PRIVATE_LEDGER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audited publisher screenshot dependencies
        run: |
          python -m pip install -r requirements-test.txt 'playwright>=1.50,<2'
          python -m playwright install --only-shell chromium
      - name: Verify cloud scheduler security boundary offline
        run: python -m unittest discover -s tests -p test_scheduled_rasd.py -q
      - name: Recover original-publisher Word interval and daily rollup safely
        shell: bash
        run: |
          set -euo pipefail
          # An article refused by a publisher never enters the ledger.
          # An uncertain SMTP reservation NEVER triggers a blind retry.
          interval_exit=0
          python scheduled_rasd.py --mode interval || interval_exit=$?
          daily_exit=0
          python scheduled_rasd.py --mode rollup_recovery || daily_exit=$?
          if [ "$interval_exit" -ne 0 ] || [ "$daily_exit" -ne 0 ]; then
            echo 'RASD_BACKUP_INTERVAL_OR_DAILY_RECOVERY_HOLD'
            exit 1
          fi
