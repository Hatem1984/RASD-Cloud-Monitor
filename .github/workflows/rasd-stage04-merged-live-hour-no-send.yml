name: RASD Stage04 exact merged live completed hour (NO SEND)
on:
  push:
    branches: ['gate-rasd-stage04-merged-live-hour-20261126']
permissions:
  contents: read
jobs:
  live-hour:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing evidence and Word renderer dependencies
        run: |
          python -m pip install -r requirements-test.txt "playwright>=1.50,<2"
          python -m playwright install --only-shell chromium
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils fonts-dejavu-core
      - name: Inspect original sources for actual most recent completed hour
        run: |
          python - <<'PY'
          import json,subprocess,tempfile,zipfile,hashlib
          from pathlib import Path
          from datetime import datetime,timezone
          from email.utils import parsedate_to_datetime
          from docx import Document
          from monitor import inspect
          from alborsa_original_listing import apply_to_inspection
          from rasd_hourly_word import build_hourly_word,completed_hour
          from daily_report import cairo_display_time
          from cloud_proof_report import proof_capture
          assert subprocess.check_output(["git","diff","--name-only","7ebea0bdf39ddfa857eac7f6382d4bf1a53dfd07","HEAD"],text=True).splitlines()==[".github/workflows/rasd-stage04-merged-live-hour-no-send.yml"]
          cfg=json.loads(Path("sources_newsroom_active.json").read_text(encoding="utf-8"))
          scan=datetime.now(timezone.utc)
          native=inspect(cfg,now=scan,article_limit=200,require_complete_items=True)
          observed=apply_to_inspection(cfg,native,scan)
          assert not observed["matched_article_pool_truncated"]
          health=[{"feed_id":s["feed_id"],"status":s["status"],"verified_links":s.get("verified_links",0),"failure_code":s.get("error_code","other")} for s in observed["sources"]]
          raw=observed["matched_public_articles"]
          start,end=completed_hour(scan)
          receipts={}
          def tracked(article,feeds,path):
              result=proof_capture(article,feeds,path)
              if result["status"]=="verified":
                  receipts[article["id"]]=result["sha256"]
              return result
          with tempfile.TemporaryDirectory(prefix="rasd-stage04-merged-") as d:
              root=Path(d)
              word=root/"actual-hour.docx"
              result=build_hourly_word(raw,cfg,health,scan,word,capture=tracked)
              assert not result["retrospective_qa"] and len(result["decisions"])==len(raw)
              selected=[row for row,decision in zip(raw,result["decisions"]) if decision=="verified_in_hour"]
              doc=Document(word)
              texts="\n".join([p.text for p in doc.paragraphs]+[c.text for t in doc.tables for r in t.rows for c in r.cells])
              links=[rel.target_ref for rel in doc.part.rels.values() if rel.reltype.endswith("/hyperlink")]
              assert len(doc.inline_shapes)==len(selected)==len(links)
              assert set(links)=={x["url"] for x in selected}
              assert all(x["headline"] in texts and cairo_display_time(parsedate_to_datetime(x["published"])) in texts and start<=parsedate_to_datetime(x["published"]).astimezone(timezone.utc)<end for x in selected)
              assert cairo_display_time(scan) in texts
              assert f'{result["fresh"]} أخبار موثقة من أصل 10 مستهدفة' in texts
              assert f'مواد أقدم خارج المستهدف الساعي: {result["counts"].get("recovery_separate",0)}' in texts
              with zipfile.ZipFile(word) as z:
                  assert z.testzip() is None
                  digests=[hashlib.sha256(z.read(name)).hexdigest() for name in z.namelist() if name.startswith("word/media/")]
              assert sorted(digests)==sorted(receipts.values())
              subprocess.run(["libreoffice","-env:UserInstallation=file://"+str(root/"profile"),"--headless","--convert-to","pdf","--outdir",str(root),str(word)],check=True,capture_output=True,timeout=60)
              pdf=root/"actual-hour.pdf"
              info=subprocess.check_output(["pdfinfo",str(pdf)],text=True)
              pages=int(next(x.split(":")[1].strip() for x in info.splitlines() if x.startswith("Pages:")))
              for page in range(1,pages+1):
                  text=subprocess.check_output(["pdftotext","-f",str(page),"-l",str(page),str(pdf),"-"],text=True)
                  assert len("".join(text.split()))>35
              print(json.dumps({"mode":"exact_merged_live_hour","production_sha":"7ebea0bdf39ddfa857eac7f6382d4bf1a53dfd07","sources_checked":len(health),"failed_sources":[s["feed_id"] for s in health if s["status"]=="failed"],"source_failure_codes":{s["feed_id"]:s["failure_code"] for s in health if s["status"]=="failed"},"pages":pages,"headline_date_link_match":True,"ordered_image_binding_verified_by_builder":True,"jpeg_digest_match":True,"word_zip_ok":True,"selected_public_originals":[{"url":x["url"],"source":x["source"],"publication":x["published"]} for x in selected],"artifact_uploaded":False,**result}),flush=True)
          PY
