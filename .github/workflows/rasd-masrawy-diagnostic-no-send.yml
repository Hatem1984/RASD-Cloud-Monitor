name: RASD — Masrawy original-date root-cause diagnostic (NO SEND)
on:
  push:
    branches:
      - 'qa-rasd-masrawy-source-root-cause-*'
permissions:
  contents: read
jobs:
  masrawy-native-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline bounded and non-leaking original date diagnostics
        run: python -m unittest discover -s tests -p test_masrawy_diagnostic_no_send.py -v
      - name: Sample at most 8 approved original Masrawy pages (NO SMTP)
        env:
          RASD_GMAIL_SENDER: ''
          RASD_GMAIL_APP_PASSWORD: ''
          RASD_REPORT_TO: ''
          RASD_REPORT_CC: ''
          RASD_PRIVATE_LEDGER_TOKEN: ''
        run: python rasd_masrawy_diagnostic_no_send.py
      - name: No generated media or private artefacts
        run: echo 'A diagnostic log only; no screenshots saved, no email or production state modified.'
