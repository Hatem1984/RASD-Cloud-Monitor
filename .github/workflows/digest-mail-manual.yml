name: RASD Daily Report Gmail — manual owner-approved only

on:
  workflow_dispatch:
    inputs:
      send_confirmation:
        description: "Mandatory for ONE approved digest: CONFIRM_ONE_MANUAL_RASD_GMAIL_RUN"
        required: true
        type: string

# No schedule/push/PR trigger; protected environment is NOT auto-provisioned.
permissions:
  contents: read

concurrency:
  group: rasd-gate11-email-serialization
  cancel-in-progress: false

jobs:
  send-daily-digest:
    if: github.ref == 'refs/heads/main' && github.actor == 'Hatem1984' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: rasd-gmail-manual-approval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing free document and browser dependencies
        run: |
          python -m pip install "Pillow>=10,<13" "python-docx>=1.1,<2" "pypdf>=5,<8" "playwright>=1.50,<2"
          python -m playwright install --with-deps chromium
      - name: Validate 100 percent offline unit and simulation suite first
        run: python -m unittest discover -s tests -v
      - name: Generate once and submit one Gmail digest with private receipt
        env:
          RASD_GATE11_SEND_APPROVED: ${{ secrets.RASD_GATE11_SEND_APPROVED }}
          RASD_GATE11_RUN_CONFIRMATION: ${{ inputs.send_confirmation }}
          RASD_GMAIL_USER: ${{ secrets.RASD_GMAIL_USER }}
          RASD_APPROVED_RECIPIENT: ${{ secrets.RASD_APPROVED_RECIPIENT }}
          RASD_GMAIL_APP_PASSWORD: ${{ secrets.RASD_GMAIL_APP_PASSWORD }}
          RASD_PRIVATE_LEDGER_TOKEN: ${{ secrets.RASD_PRIVATE_LEDGER_TOKEN }}
        run: python digest_mailer.py --mode send
