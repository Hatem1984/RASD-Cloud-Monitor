name: RASD — local/international original RSS qualification — NO SEND

on:
  push:
    branches:
      - 'qa-rasd-source-capture-expansion-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rasd-qa-original-rss-${{ github.ref }}
  cancel-in-progress: true

jobs:
  first-party-native-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RASD_AUTOMATION_ENABLED: 'false'
      RASD_HOURLY_REPORTS_ENABLED: 'false'
      RASD_GMAIL_APP_PASSWORD: ''
      RASD_PRIVATE_LEDGER_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read exact first-party RSS candidates and verify original dates/links (research only)
        run: python rasd_new_sources_firstparty_no_send.py
