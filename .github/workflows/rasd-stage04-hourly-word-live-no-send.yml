name: RASD Stage04 exact hourly Word visual and live proof (NO SEND)
on:
  push:
    branches: ['gate-rasd-stage04-hourly-word-live-20261126']
permissions:
  contents: read
jobs:
  hourly-word:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Existing proof dependencies and Word renderer
        run: |
          python -m pip install -r requirements-test.txt "playwright>=1.50,<2"
          python -m playwright install --only-shell chromium
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils fonts-dejavu-core
      - name: Exact candidate source and real rendered Word
        run: |
          python - <<'PY'
          import json, subprocess,tempfile,sys,zipfile
          from pathlib import Path
          from datetime import datetime,timezone,timedelta
          from email.utils import parsedate_to_datetime
          from docx import Document
          from monitor import inspect
          from alborsa_original_listing import apply_to_inspection
          from rasd_hourly_word import build_hourly_word,completed_hour
          from gate11_runner import candidate_from_feed
          from word_render_audit import rendered_word_preflight
          sys.path.insert(0,"tests")
          from test_stage04_hourly_word_no_send import CFG,HEALTH,NOW,row,capture
          assert subprocess.check_output(["git","diff","--name-only","2176df682e4c76cc2965d34997eeb381d8c0b7da","HEAD"],text=True).splitlines()==[".github/workflows/rasd-stage04-hourly-word-live-no-send.yml"]
          with tempfile.TemporaryDirectory(prefix="rasd-hourly-qa-") as td:
              out=Path(td)
              for n in (0,1,3,10):
                  word=out/f"synthetic-{n}.docx"
                  result=build_hourly_word([row(i) for i in range(n)],CFG,HEALTH,NOW,word,capture=capture)
                  assert result["fresh"]==n and len(Document(word).inline_shapes)==n
                  pdf_dir=out/f"render-{n}"
                  pdf_dir.mkdir()
                  subprocess.run(["libreoffice","-env:UserInstallation=file://"+str(out/f"profile-{n}"),"--headless","--convert-to","pdf","--outdir",str(pdf_dir),str(word)],check=True,capture_output=True,timeout=60)
                  pdf=pdf_dir/(word.stem+".pdf")
                  info=subprocess.check_output(["pdfinfo",str(pdf)],text=True)
                  pages=int(next(x.split(":")[1].strip() for x in info.splitlines() if x.startswith("Pages:")))
                  assert pages>=2
                  for page in range(1,pages+1):
                      txt=subprocess.check_output(["pdftotext","-f",str(page),"-l",str(page),str(pdf),"-"],text=True)
                      assert len("".join(txt.split()))>35,(n,page,"nearly empty page")
                  print(json.dumps({"mode":"synthetic_render","fresh":n,"pages":pages,"no_nearly_empty_page":True,"images":len(Document(word).inline_shapes),"email_sent":False}),flush=True)
              cfg=json.loads(Path("sources_newsroom_active.json").read_text(encoding="utf-8"))
              scan=datetime.now(timezone.utc)
              native=inspect(cfg,now=scan,article_limit=200,require_complete_items=True)
              observed=apply_to_inspection(cfg,native,scan)
              assert not observed["matched_article_pool_truncated"]
              health=[{"feed_id":s["feed_id"],"status":s["status"],"verified_links":s.get("verified_links",0)} for s in observed["sources"]]
              raw=observed["matched_public_articles"]
              word=out/"live-hour.docx"
              result=build_hourly_word(raw,cfg,health,scan,word)
              a,b=completed_hour(scan)
              print(json.dumps({"mode":"live_completed_hour","start_utc":a.isoformat(),"end_utc":b.isoformat(),"scan_utc":scan.isoformat(),"sources_checked":len(health),"failed_sources":[s["feed_id"] for s in health if s["status"]=="failed"],**result}),flush=True)
              if result["fresh"]:
                  check=rendered_word_preflight(word,expected_articles=result["fresh"],review_pages_dir=out/"live-render")
                  print(json.dumps({"mode":"live_render","status":check["status"]}),flush=True)
              else:
                  # Zero Word is still a valid sample; cannot assert live positive images.
                  assert not Document(word).inline_shapes
              # No historical sending or simulated discovery time is permitted.
              # Use separate original proof for older real candidates, not as fresh-hour evidence.
              from cloud_proof_report import proof_capture,word_images_match_capture_digests
              from daily_report import render_docx,CAIRO,cairo_display_time
              articles=[];proofs=[]
              for i,raw_row in enumerate(raw[:12]):
                  c=candidate_from_feed(raw_row,cfg,scan)
                  if c is None:continue
                  path=out/f"sample-{i}.jpg"
                  proof=proof_capture(c,cfg["feeds"],path)
                  if proof["status"]!="verified":continue
                  dt=parsedate_to_datetime(c["published"])
                  articles.append({**c,"published_at_cairo":dt.astimezone(CAIRO).strftime("%Y-%m-%d %H:%M %Z"),"published_display_cairo":cairo_display_time(dt),"evidence_image_path":str(path)})
                  proofs.append(proof)
                  if len(articles)==3:break
              if articles:
                  sample=out/"real-original-sample.docx"
                  render_docx({"title":"RASD QA original images, not hourly target","display_window_start":"QA sample","display_window_end":"QA sample","coverage":"SOURCE_LIMITED","verified_links":len(articles),"articles":articles,"sources":[],"limitations":"Original evidence sample only; no delivery"},sample)
                  assert word_images_match_capture_digests(sample,proofs)
              print(json.dumps({"mode":"separate_original_evidence_sample","verified":len(articles),"word_digest_match":bool(articles),"hourly_target_claim":False,"email_sent":False,"artifact_uploaded":False}),flush=True)
          PY
