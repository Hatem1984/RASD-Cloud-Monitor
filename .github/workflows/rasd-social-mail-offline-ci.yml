name: RASD social owner mail/CC pilot — OFFLINE SECURITY TESTS ONLY

on:
  push:
    branches:
      - 'review/rasd-social-oneoff-cc-20261109'
  pull_request:
    branches:
      - 'docs/rasd-facebook-two-track-pilot-20261109'

permissions:
  contents: read

concurrency:
  group: rasd-social-mail-offline-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-social-delivery-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing offline Word test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Entire regression suite, social CC one-time tests included
        run: python -m unittest discover -s tests -q
      - name: Actual RASD social Word builder dry run, no network/mail/private ledger
        run: python rasd_social_mail_test_once.py --mode dry_run_no_network
