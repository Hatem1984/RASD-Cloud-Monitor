name: MAAL competition unified agent — no-send CI

on:
  push:
    branches:
      - feat/maal-competition-unified-agent-20261028
  pull_request:
    branches:
      - feat/maal-snapshot-report-bundle-integrity-20261027

permissions:
  contents: read

concurrency:
  group: maal-unified-agent-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline test dependencies only
        run: python -m pip install -r requirements-test.txt
      - name: Verify source-Qwen-owner linking and all inherited safety regressions
        run: python -m unittest discover -s tests -q
      - name: No-send preflight
        run: python scheduled_rasd.py --mode dry_run
