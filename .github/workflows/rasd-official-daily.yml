name: RASD — original Ministry daily bulletin, verified Word to private Gmail

on:
  push:
    branches:
      - 'gate75-*'
      - 'gate77-*'
      - 'gate78-*'
      - main
  workflow_dispatch:  # Preview only; never access private delivery secrets
  schedule:
    - cron: '0 19 22 10 *'   # Owner-directed one-time 22 Oct 2026 at 22:00 Cairo
    - cron: '30 19 22 10 *'  # 22:30 Cairo backup; private CAS prevents duplicate
    - cron: '0 20 22 10 *'   # 23:00 Cairo final backup; date guard rejects future years
    - cron: '0 19,20 * * *' # Future daily, only after explicit production opt-in

permissions:
  contents: read

jobs:
  genuine-official-no-send-proof:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install strict original-page visual and Word tooling
        run: |
          python -m pip install -r requirements-test.txt 'playwright>=1.50,<2'
          python -m playwright install --only-shell chromium
      - name: Prove no-send offline security before visiting Ministry original pages
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -p test_official_daily.py -v
      - name: Genuine same-day Ministry source Word+screenshots ephemeral acceptance
        env:
          RASD_GMAIL_SENDER: ''
          RASD_REPORT_TO: ''
          RASD_GMAIL_APP_PASSWORD: ''
          RASD_PRIVATE_LEDGER_TOKEN: ''
        run: python rasd_official_daily.py --mode proof

  guarded-official-one-send:
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'schedule' &&
        (vars.RASD_OFFICIAL_AUTOMATION_ENABLED == 'true' ||
         github.event.schedule == '0 19 22 10 *' ||
         github.event.schedule == '30 19 22 10 *' ||
         github.event.schedule == '0 20 22 10 *')) ||
       (github.event_name == 'push' && github.actor == 'Hatem1984' &&
        (github.event.head_commit.message == 'RASD-OWNER-ONCE-2026-10-22-VERIFIED-OFFICIAL-WORD' ||
         github.event.head_commit.message == 'RASD-OWNER-VISUAL-CORRECTION-2026-10-22')))
    concurrency:
      group: rasd-scheduled-monitor-private-ledger
      cancel-in-progress: false
    environment: rasd-production
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      RASD_JOB_CRON: ${{ github.event.schedule }}
      RASD_OWNER_PUSH_CONFIRM: ${{ github.event.head_commit.message }}
      RASD_OFFICIAL_AUTOMATION_ENABLED: ${{ vars.RASD_OFFICIAL_AUTOMATION_ENABLED }}
      RASD_GMAIL_SENDER: ${{ secrets.RASD_GMAIL_SENDER }}
      RASD_REPORT_TO: ${{ secrets.RASD_REPORT_TO }}
      RASD_GMAIL_APP_PASSWORD: ${{ secrets.RASD_GMAIL_APP_PASSWORD }}
      RASD_PRIVATE_LEDGER_TOKEN: ${{ secrets.RASD_PRIVATE_LEDGER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser and secure Word verification
        run: |
          python -m pip install -r requirements-test.txt 'playwright>=1.50,<2'
          python -m playwright install --only-shell chromium
      - name: Offline auth, date and ledger safety gates
        run: python -m unittest discover -s tests -p test_official_daily.py -v
      - name: Genuinely pictured official daily Word to previously approved recipient
        run: python rasd_official_daily.py --mode send
